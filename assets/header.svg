<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="BQCKF1SH — agent online">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace; }
      .mono-s { font-size: 13px; letter-spacing: 2px; fill: #5c6a7e; }
      .title  { font-size: 112px; font-weight: 800; letter-spacing: 4px; }
      .sub    { font-size: 22px; fill: #00f0ff; letter-spacing: 1px; }
      .meta   { font-size: 13px; fill: #6b7a90; letter-spacing: 1.5px; }
      .lbl    { font-size: 10px; letter-spacing: 3px; fill: #00f0ff; opacity: .75; }

      .g-c { fill: #00f0ff; opacity: .85; animation: gc 3.2s infinite steps(1); }
      .g-m { fill: #ff2bd6; opacity: .85; animation: gm 3.2s infinite steps(1); }
      .g-w { fill: #f2f6ff; }
      .slice { animation: sl 3.2s infinite steps(1); }

      @keyframes gc { 0%{transform:translate(-3px,0)} 88%{transform:translate(-3px,0)} 90%{transform:translate(-14px,2px)} 92%{transform:translate(6px,-2px)} 94%{transform:translate(-3px,0)} }
      @keyframes gm { 0%{transform:translate(3px,0)} 88%{transform:translate(3px,0)} 90%{transform:translate(12px,-1px)} 92%{transform:translate(-8px,2px)} 94%{transform:translate(3px,0)} }
      @keyframes sl { 0%{opacity:0} 89%{opacity:0} 90%{opacity:1;transform:translate(22px,0)} 91%{transform:translate(-18px,0)} 93%{opacity:1;transform:translate(9px,0)} 94%{opacity:0} }

      .blink  { animation: bl 1s infinite steps(1); }
      .pulse  { animation: pu 2.4s ease-in-out infinite; transform-origin: 960px 160px; }
      @keyframes bl { 50% { opacity: 0 } }
      @keyframes pu { 0%,100% { opacity: .55; transform: scale(.92) } 50% { opacity: 1; transform: scale(1.06) } }
    </style>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
    </pattern>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="20%" cy="55%" r="60%">
      <stop offset="0" stop-color="#00f0ff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f0ff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <clipPath id="band"><rect x="0" y="118" width="720" height="18">
      <animate attributeName="y" values="118;150;96;132;118" dur="3.2s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="typed"><rect x="56" y="200" width="0" height="34">
      <animate attributeName="width" dur="2.2s" begin=".4s" fill="freeze" calcMode="discrete" values="0;14;27;41;55;68;82;96;109;123;137;150;164;178;191;205;219;232;246;260;273;287;300;314;328;341;355;369;382;396;410;423;437;451;464;478;492;505;519;533;546;560" keyTimes="0.0000;0.0244;0.0488;0.0732;0.0976;0.1220;0.1463;0.1707;0.1951;0.2195;0.2439;0.2683;0.2927;0.3171;0.3415;0.3659;0.3902;0.4146;0.4390;0.4634;0.4878;0.5122;0.5366;0.5610;0.5854;0.6098;0.6341;0.6585;0.6829;0.7073;0.7317;0.7561;0.7805;0.8049;0.8293;0.8537;0.8780;0.9024;0.9268;0.9512;0.9756;1.0000"/>
    </rect></clipPath>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" fill="#07070c"/>
  <rect width="1200" height="320" fill="url(#glowL)"/>

  <!-- perspective floor -->
  <g stroke="#ff2bd6" stroke-opacity=".16" stroke-width="1" fill="none">
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="262" x2="1200" y2="262"/>
    <line x1="0" y1="276" x2="1200" y2="276"/>
    <line x1="0" y1="296" x2="1200" y2="296"/>
    <path d="M600 252 L-400 320 M600 252 L-100 320 M600 252 L150 320 M600 252 L380 320 M600 252 L600 320 M600 252 L820 320 M600 252 L1050 320 M600 252 L1300 320 M600 252 L1600 320"/>
  </g>

  <!-- agent core -->
  <circle cx="960" cy="160" r="150" fill="url(#glowC)"/>
  <g fill="none" stroke-width="1.2">
    <circle cx="960" cy="160" r="112" stroke="#00f0ff" stroke-opacity=".25" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0 960 160" to="360 960 160" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="160" r="92" stroke="#00f0ff" stroke-opacity=".7" stroke-dasharray="60 14 6 14">
      <animateTransform attributeName="transform" type="rotate" from="0 960 160" to="360 960 160" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="160" r="70" stroke="#ff2bd6" stroke-opacity=".8" stroke-dasharray="110 30">
      <animateTransform attributeName="transform" type="rotate" from="360 960 160" to="0 960 160" dur="9s" repeatCount="indefinite"/>
    </circle>
    <polygon points="960,118 996,139 996,181 960,202 924,181 924,139" stroke="#f2f6ff" stroke-opacity=".55">
      <animateTransform attributeName="transform" type="rotate" from="0 960 160" to="60 960 160" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines=".7 0 .3 1"/>
    </polygon>
  </g>
  <g class="pulse">
    <circle cx="960" cy="160" r="16" fill="#ff2bd6"/>
    <circle cx="960" cy="160" r="7" fill="#f2f6ff"/>
  </g>
  <circle r="4" fill="#00f0ff">
    <animateMotion dur="6s" repeatCount="indefinite" path="M960 68 a92 92 0 1 1 -0.1 0"/>
  </circle>
  <g stroke="#00f0ff" stroke-opacity=".5" stroke-width="1">
    <line x1="1072" y1="160" x2="1110" y2="160"/>
    <line x1="960" y1="48" x2="960" y2="30"/>
    <line x1="881" y1="239" x2="858" y2="262"/>
  </g>
  <text class="lbl" x="1116" y="164">PLAN</text>
  <text class="lbl" x="960" y="24" text-anchor="middle">PERCEIVE</text>
  <text class="lbl" x="852" y="276" text-anchor="end">ACT</text>

  <!-- header line -->
  <text class="mono-s" x="56" y="58" xml:space="preserve">◢ SYS://BQCKF1SH  ·  NODE 01  ·  AGENT.STATUS = <tspan style="fill:#b6ff00">ONLINE </tspan><tspan class="blink" style="fill:#b6ff00">●</tspan></text>

  <!-- glitch title -->
  <g>
    <text class="title g-c" x="56" y="170" textLength="600" lengthAdjust="spacingAndGlyphs">BQCKF1SH</text>
    <text class="title g-m" x="56" y="170" textLength="600" lengthAdjust="spacingAndGlyphs">BQCKF1SH</text>
    <text class="title g-w" x="56" y="170" textLength="600" lengthAdjust="spacingAndGlyphs">BQCKF1SH</text>
    <g clip-path="url(#band)"><g class="slice">
      <rect x="40" y="90" width="660" height="90" fill="#07070c"/>
      <text class="title" x="56" y="170" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#00f0ff">BQCKF1SH</text>
    </g></g>
  </g>

  <!-- typed subtitle -->
  <g clip-path="url(#typed)">
    <text class="sub" x="56" y="224" textLength="560" lengthAdjust="spacingAndGlyphs">&gt; data science · ai · autonomous systems</text>
  </g>
  <rect class="blink" x="60" y="207" width="11" height="22" fill="#ff2bd6"><animate attributeName="x" dur="2.2s" begin=".4s" fill="freeze" calcMode="discrete" values="60;74;87;101;115;128;142;156;169;183;197;210;224;238;251;265;279;292;306;320;333;347;360;374;388;401;415;429;442;456;470;483;497;511;524;538;552;565;579;593;606;620" keyTimes="0.0000;0.0244;0.0488;0.0732;0.0976;0.1220;0.1463;0.1707;0.1951;0.2195;0.2439;0.2683;0.2927;0.3171;0.3415;0.3659;0.3902;0.4146;0.4390;0.4634;0.4878;0.5122;0.5366;0.5610;0.5854;0.6098;0.6341;0.6585;0.6829;0.7073;0.7317;0.7561;0.7805;0.8049;0.8293;0.8537;0.8780;0.9024;0.9268;0.9512;0.9756;1.0000"/></rect>

  <text class="meta" x="58" y="256" textLength="640" lengthAdjust="spacingAndGlyphs" xml:space="preserve">uplink: DHBW  //  formula student driverless  //  200 kg carbon-fibre unit</text>

  <!-- HUD frame -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" stroke-opacity=".8">
    <path d="M18 40 V18 H40"/>
    <path d="M1160 18 H1182 V40"/>
    <path d="M18 280 V302 H40"/>
    <path d="M1160 302 H1182 V280"/>
  </g>
  <rect x="56" y="282" width="0" height="3" fill="url(#bar)">
    <animate attributeName="width" values="0;640;640" keyTimes="0;.7;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="56" y="282" width="640" height="3" fill="#ffffff" opacity=".06"/>

  <!-- scan beam + scanlines -->
  <rect x="0" y="-80" width="1200" height="80" fill="url(#beam)">
    <animate attributeName="y" from="-80" to="320" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="320" fill="url(#scan)"/>
</svg>
