<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="end of transmission">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace; font-size: 13px; letter-spacing: 3px; fill: #5c6a7e; }
      .blink { animation: bl 1.2s infinite steps(1); }
      @keyframes bl { 50% { opacity: 0 } }
    </style>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="70" fill="#07070c"/>
  <rect x="0" y="20" width="1200" height="1" fill="url(#l)"/>
  <rect x="-200" y="19" width="200" height="3" fill="#ff2bd6" opacity=".9">
    <animate attributeName="x" from="-200" to="1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="50" text-anchor="middle" xml:space="preserve">// END OF TRANSMISSION  ·  SIGNAL <tspan class="blink" style="fill:#ff2bd6">LOST</tspan></text>
</svg>
